name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows plugin build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android Studio SDK 252
        shell: pwsh
        run: |
          $version = '2025.2.1.8'
          $expectedHash = '363CFB43B60C10A1F1A710ABC2A26E4B0E403D4D75A26A0DF1E29A6920732418'
          $archive = Join-Path $env:RUNNER_TEMP "android-studio-$version.zip"
          $directory = Join-Path $env:RUNNER_TEMP "android-studio-$version"
          curl.exe --fail --location --retry 5 "https://dl.google.com/dl/android/studio/ide-zips/$version/android-studio-$version-windows.zip" --output $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expectedHash) { throw 'Android Studio archive checksum mismatch.' }
          Expand-Archive $archive -DestinationPath $directory -Force
          $studio = Join-Path $directory 'android-studio'
          $product = Get-Content (Join-Path $studio 'product-info.json') -Raw | ConvertFrom-Json
          if ($product.buildNumber -ne '252.25557.131.2521.14432022') { throw "Unexpected Android Studio build: $($product.buildNumber)" }
          "IDE_HOME=$studio" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JAVA_HOME=$studio\jbr" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Zig 0.14.1
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'zig'
          Invoke-WebRequest 'https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip' -OutFile $archive
          Expand-Archive $archive -DestinationPath $directory -Force
          $zig = Join-Path $directory 'zig-x86_64-windows-0.14.1\zig.exe'
          if (!(Test-Path -LiteralPath $zig)) { throw 'Zig executable was not found.' }
          "ZIG_EXE=$zig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run tests and package plugin
        shell: pwsh
        run: .\gradlew.bat test buildPlugin verifyPluginStructure --no-daemon

      - name: Run native integration test
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File native/windows/tests/integration.ps1

      - name: Upload plugin and documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: file-lock-inspector-${{ github.sha }}
          path: |
            build/distributions/file-lock-inspector-*.zip
            build/distributions/file-lock-inspector-docs-*.zip
          if-no-files-found: error
